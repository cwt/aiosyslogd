[project]
name = "aiosyslogd"
version = "1.6.0"
description = "Asynchronous Syslog server using asyncio, with an optional uvloop integration and SQLite backend."
authors = [
    {name = "Chaiwat Suttipongsakul",email = "cwt@bashell.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "aiosqlite (>=0.21.0)",
    "meilisearch-python-sdk (>=4.7.0)",
    "toml (>=0.10.2)",
    "Quart (>=0.20.0,<0.23.0)",
    "loguru (>=0.7.2)",
    "prettytable (>=3.17.0,<4.0.0)"
]

[project.optional-dependencies]
speed = [
    "uvloop (>=0.22.0,<0.23.0) ; sys_platform != \"win32\"",
    "winloop (>=0.1.8,<0.2.0) ; sys_platform == \"win32\""
]
gemini = [
    "google-genai (>=2.2.0)",
    "requests (>=2.34.0)"
]

[tool.poetry]
homepage = "https://github.com/cwt/aiosyslogd"
repository = "https://github.com/cwt/aiosyslogd"

[tool.poetry.urls]
"SourceHut Mirror" = "https://hg.sr.ht/~cwt/aiosyslogd"

[tool.poetry.scripts]
aiosyslogd = "aiosyslogd.server:main"
aiosyslogd-web = "aiosyslogd.web:main"
aiosyslogd-activity = "aiosyslogd.cli_activity:main"

[tool.poetry.group.dev.dependencies]
mypy = "^2.3.1"
black = "^26.5.1"
ruff = "^0.16.5"
pytest = "^9.1.1"
pytest-asyncio = "^1.4.0"
pytest-cov = "^7.1.0"
types-toml = "^0.10.8"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore:'asyncio.get_event_loop_policy' is deprecated:DeprecationWarning",
    "ignore:'asyncio.set_event_loop_policy' is deprecated:DeprecationWarning"
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"aiosyslogd/activity/parsers/__init__.py" = ["E402"]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
